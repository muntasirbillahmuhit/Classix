//   §F num §| den §E   fraction        §R body §E   square root      §N idx §| body §E  n-th root

// ---- lowering: structured tokens -> the flat tokens the calculation engine understands ----

   if(x.length==1&&x[0].t=="num"&&x[0].v=="3"){o.push("∛(");lowerN(d.b.nodes,o);o.push(")")}
   else{o.push("(");lowerN(d.b.nodes,o);o.push(")","^(","1","÷","(");lowerN(x,o);o.push(")",")")}break}
  case"sup":if(d.fx)o.push(d.tok);else{o.push("^(");lowerN(d.e.nodes,o);o.push(")")}break;

const TPL={"√(":{t:["§R","§E"],o:1},"∛(":{t:["§N","3","§|","§E"],o:3},"^(1÷":{t:["§N","§|","§E"],o:1},"^(":{t:["§P","§E"],o:1},
 "×10^(":{t:["×","1","0","§P","§E"],o:4},"LOGB":{t:["§L","§|","§E"],o:1}};
function matchEnd(a,i){let d=0;for(let k=i;k<a.length;k++){if(OPENS.includes(a[k]))d++;else if(a[k]=="§E"){d--;if(d==0)return k}}return a.length}
function sepOf(a,i){let d=0;for(let k=i;k<a.length;k++){const t=a[k];if(OPENS.includes(t))d++;else if(t=="§E"){d--;if(d==0)return-1}else if(t=="§|"&&d==1)return k}return-1}

// typing ")" at the end of a template slot with no open "(" inside it leaves the slot (like pressing RIGHT)
function leaveSlot(a,c){

 if(v==")"&&leaveSlot(a,B.c)){B.c++;return}
 if(v=="FRAC"){let i=B.c,j=i;while(j>0&&/^[0-9.]$/.test(a[j-1]))j--;const num=a.slice(j,i);
  a.splice(j,i-j,"§F",...num,"§|","§E");B.c=j+1+num.length+(num.length?1:0);return}

// ---- shared expression parser (exact rationals and complex numbers) ----
const FAIL={};
function prim(t0){
 t0=lower(t0);const o=[];let run="";const fl=()=>{if(run){o.push({s:run,v:Number(run)});run=""}};
 for(const t of t0){
  if(/^[0-9.]$/.test(t)){run+=t;continue}
  fl();

  else if(t=="^(")o.push("^","(");
  else if(t=="^(1÷")o.push("^","(",{s:"1",v:1},"÷");
  else if(t.charAt(0)=="◆")o.push({s:null,v:KQ[+t.slice(1)]});
  else if(t.charAt(0)=="◇")o.push({s:null,v:0});
  else if(t.length>1&&t.endsWith("("))o.push({f:t.slice(0,-1)},"(");

function parse(L,O){

  if(t=="²"){i++;a=O.pw(a,O.k(2))}else if(t=="³"){i++;a=O.pw(a,O.k(3))}else if(t=="⁻¹"){i++;a=O.pw(a,O.k(-1))}
  else if(t=="%"){i++;a=O.div(a,O.k(100))}else if(t=="!"){i++;a=O.fact(a)}

// ---- exact rational arithmetic (BigInt): used when every input is an integer ----

function toFrac(v){
